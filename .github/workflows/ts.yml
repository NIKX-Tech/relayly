name: TypeScript SDK

on:
  push:
    branches: [main, dev]
    paths: ["sdk/ts/**"]
  pull_request:
    branches: [main, dev]
    paths: ["sdk/ts/**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # @noble/hashes (our Noise XX crypto backend) requires Node >=20.19.0 itself
        # (no globalThis.crypto.getRandomValues on 18 without a polyfill this SDK
        # doesn't ship) - matches the engines field in package.json.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        working-directory: sdk/ts
        run: npm ci

      - name: Type check
        working-directory: sdk/ts
        run: npm run typecheck

      - name: Test
        working-directory: sdk/ts
        run: npm test

      - name: Build
        working-directory: sdk/ts
        run: npm run build
