name: C++ SDK

on:
  push:
    branches: [main, dev]
    paths: ["sdk/cpp/**", "cmd/**", "internal/**", "go.mod", "go.sum"]
  pull_request:
    branches: [main, dev]
    paths: ["sdk/cpp/**", "cmd/**", "internal/**", "go.mod", "go.sum"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitize: true
          - os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      # The self-pair integration test builds and runs the real cmd/relayly server.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install C++ build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev

      - name: Configure
        working-directory: sdk/cpp
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            SANITIZE_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            SANITIZE_FLAGS=""
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE_FLAGS"

      - name: Build
        working-directory: sdk/cpp
        run: cmake --build build -j 4

      - name: Test
        working-directory: sdk/cpp
        run: ctest --test-dir build --output-on-failure
