name: C++ SDK

on:
  push:
    branches: [main, dev]
    paths: ["sdk/cpp/**", "cmd/**", "internal/**", "go.mod", "go.sum"]
  pull_request:
    branches: [main, dev]
    paths: ["sdk/cpp/**", "cmd/**", "internal/**", "go.mod", "go.sum"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitize: true
          - os: macos-latest
            cc: clang
            cxx: clang++
          # No self-pair integration test here (tests/CMakeLists.txt excludes it
          # on WIN32 - it's written directly against POSIX process/socket APIs).
          # The library and its unit test suite (relayly-tests) do build and run.
          - os: windows-latest
            cc: cl
            cxx: cl

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # The self-pair integration test builds and runs the real cmd/relayly server.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install C++ build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev

      # Puts cl.exe/link.exe on PATH the way a Developer Command Prompt would -
      # windows-latest runners don't have MSVC on PATH by default outside one.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # catch_discover_tests re-execs the same freshly-built, unsigned
      # relayly-tests.exe once per Catch2 test case (~20 invocations) to list and
      # then run each one. Windows Defender's real-time scanner re-inspecting an
      # unsigned binary on repeated invocation is a well-documented GitHub Actions
      # windows-latest stall (minutes per invocation in the worst case, observed
      # hands-on here: the run hung for 13+ minutes on a single, otherwise-instant
      # file save/load test) - excluding the build directory is the standard fix.
      - name: Exclude build directory from Windows Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\sdk\cpp\build"

      - name: Configure
        working-directory: sdk/cpp
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            SANITIZE_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            SANITIZE_FLAGS=""
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Ninja instead of the default multi-config Visual Studio generator so
            # CMAKE_BUILD_TYPE is honored the same way it is on Linux/macOS's
            # single-config generators, and ctest needs no --config to find binaries.
            GENERATOR_FLAGS="-G Ninja"
          else
            GENERATOR_FLAGS=""
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug $GENERATOR_FLAGS \
            -DCMAKE_C_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE_FLAGS"

      - name: Build
        working-directory: sdk/cpp
        run: cmake --build build -j 4

      # --timeout is a safety net, not the fix for the Defender stall above: a
      # genuinely hung test (this or a future one) should fail the job in minutes,
      # not exhaust the whole run's time budget silently.
      - name: Test
        working-directory: sdk/cpp
        run: ctest --test-dir build --output-on-failure --timeout 120
