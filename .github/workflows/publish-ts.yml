name: Publish TypeScript SDK

on:
  push:
    tags:
      - 'relayly-v*'

permissions:
  contents: read
  # Required for npm's OIDC trusted publishing (no NPM_TOKEN secret at all -
  # npm.com's "relayly" package trusts this exact repo/workflow/environment
  # combination and exchanges this run's OIDC token for a short-lived
  # publish credential itself). See npm's Trusted Publisher docs.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm CLI (>=11.5.1); the version
      # bundled with setup-node's Node 20 predates that. Pinned to the 11.x
      # line, not @latest: npm 12 requires Node >=22.9.0 and this job's on
      # Node 20 (npm 11.x's own engines range - ^20.17.0 || >=22.9.0 -
      # covers it).
      - name: Update npm
        run: npm install -g npm@^11

      - name: Install & Build
        working-directory: sdk/ts
        run: npm ci && npm run build

      - name: Publish
        working-directory: sdk/ts
        run: npm publish
